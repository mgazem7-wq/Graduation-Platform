<!DOCTYPE html>

                <div>
                    <div class="sidebar-logo-text">مشاريع التخرج</div>
                    <div class="sidebar-logo-sub">جامعة تعز</div>
                </div>
            </a>
        </div>
        
        <nav class="sidebar-nav">
            <div class="sidebar-section-title">القائمة الرئيسية</div>
            <a href="dashboard.html" class="nav-item" data-page="dashboard">
                <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
                <span class="nav-label">لوحة التحكم</span>
            </a>
            <a href="projects.html" class="nav-item active" data-page="projects">
                <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" /></svg>
                <span class="nav-label">المشاريع</span>
            </a>
            <a href="archive.html" class="nav-item" data-page="archive">
                <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" /></svg>
                <span class="nav-label">الأرشيف والمعرض</span>
            </a>
            
            <div class="sidebar-section-title" style="margin-top:16px;">الحساب</div>

        <div class="sidebar-user">
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="avatar" id="sidebar-user-avatar">م</div>
                <div style="flex:1;min-width:0;">
                    <div class="sidebar-user-name" id="sidebar-user-name">جارٍ التحميل...</div>
                    <div class="sidebar-user-role" id="sidebar-user-role"></div>
                </div>
                <button onclick="logout()" class="btn btn-ghost btn-icon btn-sm" title="تسجيل الخروج" style="color:var(--sidebar-text);">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" /></svg>
                </button>
            </div>
        </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
        <header class="top-header">
            <button class="btn btn-ghost btn-icon sidebar-toggle" style="display:none" id="mobile-menu-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
            </button>
            <div class="page-breadcrumb" id="page-breadcrumb">
                المشاريع
            </div>
            <div style="margin-right:auto;display:flex;align-items:center;gap:12px;">
                <div style="position:relative;">
                    <button class="btn btn-ghost btn-icon" id="notif-btn" title="الإشعارات">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" /></svg>
                    </button>
                    <span class="header-notif-badge hidden" id="notif-badge" style="position:absolute;top:4px;right:4px;min-width:18px;height:18px;background:#DC2626;color:white;border-radius:9999px;font-size:0.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;"></span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;font-size:0.875rem;color:var(--color-text-secondary);">
                    <div class="avatar sm" id="header-avatar" style="background:var(--color-primary);">م</div>
                    <span id="header-user-name">مستخدم</span>
                </div>
            </div>
        </header>

        <div class="page-main">
            <div class="page-header flex items-center justify-between mb-6">
                <div>
                    <h1 class="page-title">المشاريع</h1>
                    <p class="page-subtitle text-muted" id="projects-subtitle">استعرض وإدارة المشاريع</p>
                </div>
                <div class="page-actions hidden" id="student-actions">
                    <a href="project-new.html" class="btn btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                        مشروع جديد
                    </a>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-bar mb-6 card p-4 flex gap-4 items-center" style="flex-wrap:wrap;">
                <div class="search-wrap" style="flex:1;min-width:200px;">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 15.803 7.5 7.5 0 0 0 15.803 15.803Z" /></svg>
                    <input type="text" id="filter-search" class="search-input" placeholder="ابحث عن مشروع...">
                </div>
                <select id="filter-status" class="filter-select form-select">
                    <option value="">جميع الحالات</option>
                    <option value="draft">مسودة</option>
                    <option value="under_review">قيد المراجعة</option>
                    <option value="approved">مقبول</option>
                    <option value="rejected">مرفوض</option>
                    <option value="in_progress">قيد التنفيذ</option>
                    <option value="awaiting_jury">بانتظار التحكيم</option>
                    <option value="needs_revision">بحاجة لتعديل</option>
                    <option value="completed">مكتمل</option>
                </select>
                <select id="filter-spec" class="filter-select form-select">
                    <option value="">جميع التخصصات</option>
                    <option value="علوم الحاسب">علوم الحاسب</option>
                    <option value="هندسة البرمجيات">هندسة البرمجيات</option>
                    <option value="نظم المعلومات">نظم المعلومات</option>
                    <option value="الذكاء الاصطناعي">الذكاء الاصطناعي</option>
                </select>
                <select id="filter-year" class="filter-select form-select">
                    <option value="">جميع السنوات</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                </select>
                <div class="flex gap-2">
                    <button class="btn btn-icon btn-outline active" id="view-grid" title="عرض شبكي">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" /></svg>
                    </button>
                    <button class="btn btn-icon btn-outline" id="view-list" title="عرض قائمة">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z" /></svg>
                    </button>
                </div>
            </div>

            <!-- Content -->
            <div id="projects-container">
                <div class="loading-container p-8 text-center">
                    <div class="loading-spinner mb-4"></div>
                    <p class="text-muted">جارٍ تحميل المشاريع...</p>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination mt-6 flex justify-center gap-2 hidden" id="pagination">
                <button class="page-btn active">1</button>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/projects.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof requireAuth === 'function') {
                const auth = await requireAuth();
                if (!auth) return;
                
                if (typeof updateSidebarUser === 'function') updateSidebarUser(auth.profile);
                if (typeof setActiveNavItem === 'function') setActiveNavItem();
                if (typeof initSidebar === 'function') initSidebar();
                
                if (auth.profile.role === 'student') {
                    const act = document.getElementById('student-actions');
                    if (act) act.classList.remove('hidden');
                    document.getElementById('projects-subtitle').innerText = 'مشاريعك الخاصة';
                } else if (auth.profile.role === 'supervisor') {
                    document.getElementById('projects-subtitle').innerText = 'المشاريع المشرف عليها';
                }
                
                initProjectsPage();
            }
        });
    </script>
</body>
</html>
